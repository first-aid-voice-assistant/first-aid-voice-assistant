name: first_aid_voice_assistant
description: "Demo mobile app of the first-aid voice assistant (PoC)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.5.2
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  piper_phonemize: ^1.5.9
  record: ^7.1.2
  shared_preferences: ^2.5.6
  sherpa_onnx: ^2.0.1
  url_launcher: ^6.3.3
  vosk_flutter_service: ^0.1.3
  wakelock_plus: ^1.8.2
  web_socket_channel: ^3.0.3
  whisper_cpp_flutter_plus: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/cpr/
    - assets/sounds/
