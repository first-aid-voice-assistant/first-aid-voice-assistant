# Qwen2.5 7B Instruct Q4_K_M (about 4.7 GB) in the Ollama container, app on the host (like
# gemma.yaml). The same model as experiments/qwen25-7b-compose.yaml, only the addresses differ.
# Run: APP_CONFIG=configs/qwen.yaml. Needs the GPU override, see the "GPU" section of the README.
# Pull once: docker compose exec llm ollama pull qwen2.5:7b-instruct-q4_K_M
asr:
  provider: openai_compat
  params: { base_url: "http://localhost:8001/v1", model: large-v3, language: pl }
  hotwords_file: configs/domain_terms.txt
llm:
  provider: litellm
  params:
    model: "ollama_chat/qwen2.5:7b-instruct-q4_K_M"
    api_base: "http://localhost:11434"
    temperature: 0.2
rag: { enabled: false }
knowledge: { enabled: true, path: ../../knowledge }   # scenarios from knowledge/ in the prompt
event_log: { enabled: false }   # on only for clients that handle the `action_logged` event
prompts: { system: prompts/system_v1.md, knowledge: prompts/scenario_v1.yaml,
           event_log: prompts/event_log_v1.yaml }
