# Choking in an adult (foreign body airway obstruction), for a layperson. Escalating approach of
# the ERC 2025 First Aid guideline: cough, then up to five back blows, then up to five abdominal
# thrusts, then the two alternating; CPR when the person becomes unresponsive. Wording is Polish
# and meant to be read aloud (numbers in words); ids, structure and comments are English.
#
# NEEDS MEDICAL REVIEW:
# UNCERTAIN: when the emergency call is made. This scenario follows the ERC order (call
#   after the first round of five back blows and five abdominal thrusts) and asks anyone
#   nearby to call at once; a rescuer who is alone calls in `call_and_alternate`.
# WHY: the project safety rule is 'call first at any threat to life', the guideline
#   lists the call later and says it has no data on a choking person who is alone.
id: adult-choking
title: Zadławienie osoby dorosłej
trigger: >-
  Dorosły nagle nie może mówić ani kaszleć, dusi się, łapie się za szyję, zwłaszcza podczas
  jedzenia.
level: layperson
start: recognise

steps:
  - id: recognise
    instructions:
      - Zapytaj poszkodowanego, czy się dławi.
    transitions:
      - when: poszkodowany potwierdza, że się dławi, albo nie może mówić ani kaszleć
        goto: encourage_cough
    sources:
      - {source: erc-2025-first-aid, section: Choking in an adult person}

  - id: encourage_cough
    actions: [ENCOURAGE_COUGH]
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: Asking anyone nearby to call 112 right away, while a rescuer who is alone calls
        only after the first round of back blows and abdominal thrusts.
      WHY: ERC lists the call after the first round of blows and thrusts, and has no data on a
        choking person who is alone. The request to a bystander is not in the guideline's order;
        it follows the project rule 'call first' and the principle 'call as soon as possible'.
        Decide whether a lone rescuer should call earlier.
      ERC: Choking in an adult person; Choking (treatment of the awake, responsive person).
    instructions:
      - Zachęcaj poszkodowanego do kaszlu.
      - Jeśli ktoś jest obok, poproś, żeby zadzwonił pod dziewięćset dziewięćdziesiąt dziewięć.
    transitions:
      - when: poszkodowany skutecznie kaszle
        goto: encourage_cough
      - when: przeszkoda usunięta, poszkodowany oddycha i mówi
        goto: relieved
      - when: poszkodowany nie może kaszleć albo kaszel jest nieskuteczny
        goto: back_blows
    sources:
      - {source: erc-2025-first-aid, section: Choking in an adult person}
      - {source: erc-2025-first-aid, section: Choking – Treatment of the awake, responsive person with foreign body airway obstruction}
      - {source: erc-2025-first-aid, section: Expectations of a first aid provider}

  - id: back_blows
    actions: [BACK_BLOWS]
    instructions:
      - Stań za poszkodowanym.
      - Wykonaj do pięciu uderzeń w plecy nasadą dłoni, w środku pleców między łopatkami.
    transitions:
      - when: przeszkoda usunięta
        goto: relieved
      - when: uderzenia w plecy nie pomogły
        goto: abdominal_thrusts
    sources:
      - {source: erc-2025-first-aid, section: Choking in an adult person}
      - {source: erc-2025-first-aid, section: Choking – Treatment of the awake, responsive person with foreign body airway obstruction}

  - id: abdominal_thrusts
    actions: [ABDOMINAL_THRUSTS]
    instructions:
      - Stań za poszkodowanym i obejmij go obiema rękami w górnej części brzucha. Pochyl go do przodu.
      - Zaciśnij pięść i umieść ją między pępkiem a dolnym brzegiem żeber. Chwyć pięść drugą dłonią.
      - Wykonaj do pięciu uciśnięć nadbrzusza, pociągając mocno do siebie i ku górze.
    transitions:
      - when: przeszkoda usunięta
        goto: relieved
      - when: uciśnięcia nadbrzusza nie pomogły
        goto: call_and_alternate
    sources:
      - {source: erc-2025-first-aid, section: Choking in an adult person}
      - {source: erc-2025-first-aid, section: Choking – Treatment of the awake, responsive person with foreign body airway obstruction}

  - id: call_and_alternate
    actions: [CALL_EMERGENCY, BACK_BLOWS, ABDOMINAL_THRUSTS]
    note: >-
      The guideline: continue alternating five back blows and five abdominal thrusts until the
      choking is relieved or the person becomes unresponsive; call the emergency number; do not
      use blind finger sweeps (a finger sweep only when the object is clearly visible).
    instructions:
      - Zadzwoń pod dziewięćset dziewięćdziesiąt dziewięć albo poproś kogoś, żeby zadzwonił. Włącz tryb głośnomówiący.
      - Dalej wykonuj naprzemiennie pięć uderzeń w plecy i pięć uciśnięć nadbrzusza, aż przeszkoda zostanie usunięta albo poszkodowany straci przytomność.
      - Nie wyciągaj przeszkody z ust palcami na ślepo.
    transitions:
      - when: przeszkoda usunięta
        goto: relieved
      - when: poszkodowany stracił przytomność
        goto: unresponsive
    sources:
      - {source: erc-2025-first-aid, section: Choking in an adult person}
      - {source: erc-2025-first-aid, section: Choking – Treatment of the unresponsive person with foreign body airway obstruction}

  - id: unresponsive
    note: >-
      ERC: if the person becomes unresponsive with absent or abnormal breathing, chest compressions
      are started according to standard BLS (compressions generate higher airway pressures than
      abdominal thrusts). The hand-off continues in adult-bls at the compressions.
    instructions:
      - Poszkodowany stracił przytomność. Upewnij się, że wezwano pogotowie pod numer dziewięćset dziewięćdziesiąt dziewięć, i od razu zacznij RKO.
    transitions:
      - when: zawsze
        handoff: adult-bls/chest_compressions
    sources:
      - {source: erc-2025-first-aid, section: Choking in an adult person}
      - {source: erc-2025-first-aid, section: Choking – Treatment of the unresponsive person with foreign body airway obstruction}

  - id: relieved
    instructions:
      - Dobrze. Poszkodowany powinien zostać zbadany przez lekarza lub ratownika, nawet jeśli czuje się dobrze, bo po uciśnięciach mogą wystąpić powikłania.
    transitions: []
    sources:
      - {source: erc-2025-first-aid, section: Choking in an adult person}
      - {source: erc-2025-first-aid, section: Choking – Aftercare and referral for medical review}
