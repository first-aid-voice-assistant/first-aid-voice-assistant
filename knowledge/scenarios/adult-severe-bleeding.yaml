# Life-threatening external bleeding in an adult, for a layperson. Based only on the ERC
# Guidelines 2025 First Aid ("Control of life-threatening bleeding", Fig. 9): firm direct manual
# pressure on the injury; a standard or haemostatic dressing pushed into the wound with firm
# pressure on top; a pressure dressing once the bleeding is under control; a tourniquet as soon as
# possible for life-threatening bleeding of a limb that direct pressure does not control, with the
# time of application written on it. Wording is Polish and meant to be read aloud (numbers in
# words); ids, structure and comments are English. No pictures yet (the app has none for this
# scenario).
#
# NEEDS MEDICAL REVIEW:
# UNCERTAIN: the tourniquet step. It is offered only to a caller who has a manufactured
#   tourniquet and knows how to use it; otherwise the scenario keeps the pressure going.
# WHY: the guideline says both 'apply a tourniquet as soon as possible for uncontrolled
#   limb bleeding' and 'only use equipment you have been trained to use', and does not
#   say what an untrained rescuer should do.
#
# NEEDS MEDICAL REVIEW:
# UNCERTAIN: handing off to the BLS response check from every step of this scenario when the
#   person stops responding, without saying what to do with the pressure on the wound meanwhile.
# WHY: ERC 2025 gives the BLS algorithm for a person who does not respond, and the bleeding
#   guideline does not say how the two combine; the hand-off follows the project rule 'call for
#   help, then check response and breathing'.
id: adult-severe-bleeding
title: Silne krwawienie zewnętrzne u osoby dorosłej
trigger: >-
  Dorosły poszkodowany ma silne, zagrażające życiu krwawienie z rany (krew tryska lub płynie
  strumieniem, szybko przesiąka ubranie albo tworzy kałużę).
level: layperson
start: safety

steps:
  - id: safety
    actions: [CHECK_SAFETY]
    instructions:
      - text: Upewnij się, że Ty i poszkodowany jesteście bezpieczni, na przykład że nie zagraża Wam ruch uliczny, rozlane substancje albo agresywna osoba.
        action: CHECK_SAFETY
    transitions:
      - when: jest bezpiecznie
        goto: call_emergency
      - when: coś zagraża ratownikowi
        goto: unsafe
    sources:
      - {source: erc-2025-first-aid, section: Expectations of a first aid provider}
      - {source: erc-2025-first-aid, section: "Structured first aid assessment of a person appearing ill, injured or in shock (ABCDE)"}

  - id: unsafe
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: Whether 'stay away and call 112' is right for every unsafe scene.
      WHY: The guideline lists scene safety as the first principle but does not describe this
        branch. It follows the project rule 'rescuer safety first'. 112 (not 999) is used because
        the danger may need the fire brigade or the police.
      ERC: Expectations of a first aid provider: check for scene safety.
    instructions:
      - Nie podchodź do poszkodowanego, dopóki miejsce nie jest bezpieczne. Zadzwoń pod sto dwanaście i słuchaj poleceń dyspozytora.
    transitions: []
    sources:
      - {source: erc-2025-first-aid, section: Expectations of a first aid provider}

  - id: call_emergency
    actions: [CALL_EMERGENCY]
    note: >-
      ERC: call the local emergency number as soon as possible. The speakerphone keeps the
      rescuer's hands free for the pressure; if the call is not possible the scenario goes straight
      on and never sends the rescuer away from the person.
    instructions:
      - text: Jeśli ktoś jest z Tobą, poproś, żeby zadzwonił pod dziewięćset dziewięćdziesiąt dziewięć. Jeśli jesteś sam, zadzwoń sam.
        action: CALL_EMERGENCY
      - Włącz w telefonie tryb głośnomówiący, żeby mieć wolne ręce.
    transitions:
      - when: zawsze  # the call was confirmed by the first instruction; "ok" after the speakerphone one goes on
        goto: direct_pressure
      - when: rozmówca nie może zadzwonić (brak zasięgu lub sieci, brak telefonu)
        goto: direct_pressure
        obstacle: true
    sources:
      - {source: erc-2025-first-aid, section: Expectations of a first aid provider}

  - id: direct_pressure
    actions: [DIRECT_PRESSURE, APPLY_DRESSING]
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: (1) 'Keep pressing without letting go' (continuous pressure, no time limit); (2)
        pushing a dressing into the wound; (3) the split by body part: limb -> tourniquet, trunk,
        neck or head -> keep pressing.
      WHY: ERC gives 'firm direct manual pressure' and a dressing 'directly into the bleeding
        injury', with no duration and no advice for an untrained rescuer; continuous pressure is
        our reading. Tourniquets are described only for limbs, so for other body parts the
        guideline offers nothing beyond direct pressure and we add nothing.
      ERC: Control of life-threatening bleeding (direct manual pressure preferred over pressure
        points and pressure devices).
    instructions:
      - text: Mocno uciśnij dłonią ranę, w miejscu krwawienia.
        action: DIRECT_PRESSURE
      - text: Jeśli masz opatrunek, zwykły albo hemostatyczny, włóż go bezpośrednio w ranę i mocno uciśnij go dłonią od góry.
        action: APPLY_DRESSING
      - Nie przestawaj uciskać.
    asks: Czy krwawienie ustało albo jest pod kontrolą?
    transitions:
      - when: krwawienie ustało albo jest pod kontrolą
        goto: pressure_dressing
        log: BLEEDING_CONTROLLED
      - when: krwawienie trwa, a rana jest na ręce albo nodze
        goto: tourniquet_check
      - when: krwawienie trwa, a rana jest na tułowiu, szyi albo głowie
        goto: keep_pressing
      - when: poszkodowany przestał reagować
        handoff: adult-bls/check_response
        log: UNRESPONSIVE
        interrupt: true
    sources:
      - {source: erc-2025-first-aid, section: Control of life-threatening bleeding}

  - id: pressure_dressing
    actions: [APPLY_PRESSURE_DRESSING]
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: How to apply a pressure dressing, and whether an untrained rescuer should try.
      WHY: ERC says only to apply a pressure dressing once the bleeding is under control; it
        describes no technique. The instruction lets the rescuer keep pressing and ask the
        dispatcher if they do not know how.
      ERC: Control of life-threatening bleeding.
    instructions:
      - text: Gdy krwawienie jest pod kontrolą, załóż opatrunek uciskowy. Jeśli nie wiesz, jak go założyć, dalej uciskaj ranę i poproś o pomoc dyspozytora.
        action: APPLY_PRESSURE_DRESSING
    transitions:
      - when: opatrunek uciskowy założony
        goto: after_bleeding
      - when: krwawienie wróciło
        goto: direct_pressure
        log: BLEEDING_RETURNED
        interrupt: true
      - when: poszkodowany przestał reagować
        handoff: adult-bls/check_response
        log: UNRESPONSIVE
        interrupt: true
    sources:
      - {source: erc-2025-first-aid, section: Control of life-threatening bleeding}

  - id: tourniquet_check
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: Offering a tourniquet only to a caller who says they have a manufactured one and
        know how to use it, and judging 'bleeding not controlled by pressure' from the caller's
        answer.
      WHY: ERC says both 'apply a tourniquet as soon as possible for uncontrolled limb bleeding'
        and 'only use equipment you have been trained to use'. It gives no advice for an untrained
        rescuer, no time criterion for 'not controlled', and does not forbid improvised
        tourniquets (it only says manufactured ones work better); the scenario offers none.
      ERC: Control of life-threatening bleeding (Tourniquets); Expectations of a first aid
        provider.
    instructions:
      - Jeśli krwawienie z ręki lub nogi nie ustaje mimo ucisku, potrzebna jest opaska uciskowa, czyli staza.
    asks: Czy masz fabryczną opaskę uciskową i wiesz, jak jej użyć?
    transitions:
      - when: tak, ma opaskę i potrafi jej użyć
        goto: tourniquet
      - when: nie ma opaski albo nie wie, jak jej użyć
        goto: keep_pressing
      - when: poszkodowany przestał reagować
        handoff: adult-bls/check_response
        log: UNRESPONSIVE
        interrupt: true
    sources:
      - {source: erc-2025-first-aid, section: Control of life-threatening bleeding}
      - {source: erc-2025-first-aid, section: Expectations of a first aid provider}

  - id: tourniquet
    actions: [APPLY_TOURNIQUET, NOTE_TOURNIQUET_TIME]
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: The second tourniquet ('if the bleeding does not stop, apply a second one above
        the first') and 'do not loosen it' for a layperson.
      WHY: ERC says a second tourniquet may be needed 'in some cases' without saying when, and
        that only a healthcare professional should release the tourniquet; concern about injury
        from prolonged use is noted in the evidence section. The numbers (5-7 cm above the injury,
        not over a joint) and writing the time are from the text.
      ERC: Control of life-threatening bleeding (Tourniquets).
    instructions:
      - text: Załóż opaskę na kończynę, około pięciu do siedmiu centymetrów powyżej rany, ale nie na stawie.
        action: APPLY_TOURNIQUET
      - Zaciągaj opaskę, aż krwawienie zwolni i ustanie. Może to być bolesne dla poszkodowanego.
      - text: Zapisz na opasce godzinę jej założenia.
        action: NOTE_TOURNIQUET_TIME
      - Nie zdejmuj ani nie poluzowuj opaski. Może to zrobić tylko pracownik ochrony zdrowia.
      - Jeśli krwawienie nie ustaje, załóż drugą opaskę powyżej pierwszej.
    asks: Czy krwawienie ustało albo wyraźnie zwolniło?
    transitions:
      - when: krwawienie ustało albo wyraźnie zwolniło
        goto: after_bleeding
        log: BLEEDING_CONTROLLED
      - when: krwawienie trwa mimo opaski
        goto: keep_pressing
      - when: poszkodowany przestał reagować
        handoff: adult-bls/check_response
        log: UNRESPONSIVE
        interrupt: true
    sources:
      - {source: erc-2025-first-aid, section: Control of life-threatening bleeding}

  - id: keep_pressing
    actions: [DIRECT_PRESSURE]
    instructions:
      - text: Dalej mocno uciskaj ranę i nie puszczaj. Słuchaj poleceń dyspozytora.
        action: DIRECT_PRESSURE
    transitions:
      - when: krwawienie ustało albo jest pod kontrolą
        goto: pressure_dressing
        log: BLEEDING_CONTROLLED
      - when: poszkodowany przestał reagować
        handoff: adult-bls/check_response
        log: UNRESPONSIVE
        interrupt: true
    sources:
      - {source: erc-2025-first-aid, section: Control of life-threatening bleeding}

  - id: after_bleeding
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: The closing advice (stay, observe, press again if the bleeding returns, hand off
        to the response check if the person stops responding); no mention of positioning for
        shock.
      WHY: It is not a step of the bleeding algorithm; it follows the ABCDE reassessment and
        project rules. ERC says passive leg raising may be appropriate in some first aid settings
        but is not recommended routinely, so it is left out.
      ERC: Structured first aid assessment (ABCDE); Control of life-threatening bleeding.
    instructions:
      - Dobrze. Zostań z poszkodowanym, obserwuj go i słuchaj poleceń dyspozytora. Jeśli krwawienie wróci, ponownie mocno uciśnij ranę.
    transitions:
      - when: krwawienie wróciło
        goto: direct_pressure
        log: BLEEDING_RETURNED
        interrupt: true
      - when: poszkodowany przestał reagować
        handoff: adult-bls/check_response
        log: UNRESPONSIVE
        interrupt: true
    sources:
      - {source: erc-2025-first-aid, section: Control of life-threatening bleeding}
      - {source: erc-2025-first-aid, section: "Structured first aid assessment of a person appearing ill, injured or in shock (ABCDE)"}
