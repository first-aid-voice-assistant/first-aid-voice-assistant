# Adult basic life support for a layperson (cardiac arrest: unresponsive, not breathing normally).
# Based only on the ERC Guidelines 2025 (Adult Basic Life Support, First Aid). The order follows
# the ERC "three steps to save a life": check (safety, response), call the emergency number for
# any unresponsive person and assess breathing while the call is being answered, then start CPR
# (compressions first; rescue breaths 30:2 only for trained rescuers); use an AED as soon as it
# is at the person's side. Wording is Polish and meant to be read aloud (numbers in words); ids,
# structure and comments are English.
#
# `instructions` are given one at a time, one per turn of the conversation, so an item is one thought
# the rescuer can act on, in at most two short sentences. Gestures that belong together are one item.
# A step without `transitions` ends the scenario.
# `media` names the picture the mobile app shows while an instruction is said (per step, or per
# instruction as `{text, media}`); the pictures are drawings and need the same medical review.
# NOTE: `cpr/aed` has no drawing in the app yet (it falls back to the generic scene picture).
id: adult-bls
title: Resuscytacja krążeniowo-oddechowa osoby dorosłej (RKO)
trigger: >-
  Dorosły poszkodowany nie reaguje (nie odpowiada, nie rusza się) albo nie oddycha lub oddycha
  nieprawidłowo.
level: layperson
start: safety

steps:
  - id: safety
    media: cpr/scene-safety
    actions: [CHECK_SAFETY]
    instructions:
      - text: Upewnij się, że Ty, poszkodowany i świadkowie jesteście bezpieczni.
        action: CHECK_SAFETY
    transitions:
      - when: jest bezpiecznie
        goto: check_response
      - when: coś zagraża ratownikowi (ruch uliczny, prąd, ogień, gaz, agresywna osoba)
        goto: unsafe
    sources:
      - {source: erc-2025-bls, section: Safety}
      - {source: erc-2025-bls, section: Concise resuscitation guidelines for all responders}

  - id: unsafe
    media: cpr/keep-away
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: Whether 'stay away and call 112' is the right instruction for every unsafe scene.
      WHY: The guideline only says to ensure the safety of the rescuer, the person and bystanders;
        this branch is not spelled out. It follows the project rule 'rescuer safety first'. 112
        (not 999) is used because the danger may need the fire brigade or the police.
      ERC: Safety: 'Ensure the safety of yourself, the person in cardiac arrest, and any
        bystanders.'
    instructions:
      - Nie podchodź do poszkodowanego, dopóki miejsce nie jest bezpieczne. Zadzwoń pod sto dwanaście i słuchaj poleceń dyspozytora.
    transitions: []
    sources:
      - {source: erc-2025-bls, section: Safety}

  - id: check_response
    media: cpr/shake-shoulders
    actions: [CHECK_RESPONSE]
    instructions:
      - text: Delikatnie potrząśnij poszkodowanego za ramiona i głośno zapytaj, czy wszystko w porządku.
        action: CHECK_RESPONSE
    transitions:
      - when: poszkodowany nie reaguje
        goto: call_emergency
        log: UNRESPONSIVE
      - when: poszkodowany reaguje (odpowiada, rusza się)
        goto: responsive
    sources:
      - {source: erc-2025-bls, section: Concise resuscitation guidelines for all responders}
      - {source: erc-2025-first-aid, section: "Structured first aid assessment of a person appearing ill, injured or in shock (ABCDE)"}

  - id: responsive
    media: cpr/stay-observe
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: The advice for a person who does respond: stay, observe, call if in doubt or if
        worse.
      WHY: The BLS algorithm covers only people who do not respond. The ABCDE assessment of a
        responsive person (First Aid guideline) is outside this scenario, so this is a minimal
        safe default taken from the general principle 'always call for help'.
      ERC: Expectations of a first aid provider: call for help as a general principle.
    instructions:
      - Poszkodowany reaguje, więc to nie jest sytuacja do RKO. Zostań przy nim i go obserwuj. Jeśli masz jakiekolwiek wątpliwości albo jego stan się pogarsza, zadzwoń pod dziewięćset dziewięćdziesiąt dziewięć.
    transitions: []
    sources:
      - {source: erc-2025-first-aid, section: Expectations of a first aid provider}

  - id: call_emergency
    actions: [CALL_EMERGENCY]
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: What to do when the caller cannot phone (no signal, no phone): the scenario goes
        straight to the breathing check and CPR and never sends the rescuer away.
      WHY: ERC lets a lone rescuer shout for help and, if no one comes, leave the person to call
        for help 'as quickly as possible'. The project deliberately omits that instruction (it
        never sends the rescuer away). The ERC itself says there is no evidence on how long to
        continue CPR before leaving. A reviewer should decide whether to add 'shout for help' and
        a 'leave to call' rule.
      ERC: Alerting the emergency services (call first for any unresponsive person, speaker mode,
        assess breathing while the call is answered).
    instructions:
      - text: Jeśli ktoś jest z Tobą, poproś, żeby zadzwonił pod dziewięćset dziewięćdziesiąt dziewięć. Jeśli jesteś sam, zadzwoń sam.
        media: cpr/call-112
        action: CALL_EMERGENCY
      - text: Włącz w telefonie tryb głośnomówiący, żeby móc zacząć RKO w trakcie rozmowy z dyspozytorem. Jeśli to możliwe, zostań z poszkodowanym.
        media: cpr/speakerphone
    transitions:
      - when: zawsze  # the call was confirmed by the first instruction; "ok" after the speakerphone one goes on
        goto: check_breathing
      - when: rozmówca nie może zadzwonić (brak zasięgu lub sieci, brak telefonu)
        goto: check_breathing
        obstacle: true
    sources:
      - {source: erc-2025-bls, section: Alerting the emergency services}
      - {source: erc-2025-bls, section: Concise resuscitation guidelines for all responders}

  - id: check_breathing
    actions: [OPEN_AIRWAY, CHECK_BREATHING]
    note: >-
      Per ERC 2025 the call comes first and breathing is assessed while the call is answered;
      the dispatcher helps when the caller is unsure. Abnormal breathing as listed in the
      guideline: slow, laboured, agonal gasping, panting, and the words laypeople use (gasping,
      barely breathing, moaning, sighing, gurgling, noisy, groaning, snorting). Seizure-like
      movements may occur at the onset of cardiac arrest: breathing is assessed once they stop.
      The head tilt and chin lift come from the ABCDE table of the First Aid guideline.
    instructions:
      - text: Ułóż poszkodowanego na plecach.
        media: cpr/lay-on-back
      - text: Jedną rękę połóż na jego czole, a opuszki palców drugiej pod brodą. Delikatnie odegnij głowę do tyłu i unieś brodę.
        media: cpr/head-tilt
        action: OPEN_AIRWAY
      - text: Przez nie dłużej niż dziesięć sekund patrz, słuchaj i staraj się wyczuć, czy poszkodowany oddycha.
        media: cpr/check-breathing
        action: CHECK_BREATHING
    asks: Czy poszkodowany oddycha prawidłowo?
    transitions:
      - when: >-
          nie oddycha, oddycha nieprawidłowo (łapie powietrze, dyszy, oddycha bardzo powoli albo
          z wysiłkiem, charczy, chrapie, jęczy) albo rozmówca nie ma pewności
        goto: chest_compressions
        log: BREATHING_ABNORMAL
      - when: oddycha prawidłowo
        goto: breathing_normally
    sources:
      - {source: erc-2025-bls, section: Recognising cardiac arrest}
      - {source: erc-2025-bls, section: Concise resuscitation guidelines for all responders}
      - {source: erc-2025-first-aid, section: "Structured first aid assessment of a person appearing ill, injured or in shock (ABCDE)"}

  - id: breathing_normally
    media: cpr/stay-observe
    note: >-
      An unresponsive person who breathes normally does not meet the criteria for CPR; the ERC
      First Aid guideline then recommends the recovery position (scenario adult-recovery-position).
    instructions:
      - Poszkodowany oddycha prawidłowo, ale nie reaguje. Zostań przy nim i cały czas obserwuj jego oddech. Zaraz ułożymy go w bezpiecznej pozycji.
    transitions:
      - when: zawsze
        handoff: adult-recovery-position/check_trauma
    sources:
      - {source: erc-2025-bls, section: Recognising cardiac arrest}
      - {source: erc-2025-first-aid, section: Recovery position}

  - id: chest_compressions
    actions: [CHEST_COMPRESSIONS]
    note: >-
      Compressions first (ILCOR 2025, ERC 2025). The guideline calls the centre of the chest
      the place for the hands and shows that this is the lower half of the sternum. Kneeling
      beside the person and the surface of the compressions are shown only in the figures;
      the guideline does not advise moving a person from a soft surface to the floor.
    instructions:
      - text: Uklęknij obok poszkodowanego. Jeśli ubranie przeszkadza w znalezieniu mostka, odsłoń klatkę piersiową.
        media: cpr/kneel
      - text: Połóż nasadę jednej dłoni na środku klatki piersiowej, czyli na dolnej połowie mostka.
        media: cpr/hand-position
      - text: Drugą dłoń połóż na pierwszej i spleć palce. Wyprostuj ramiona i ustaw je pionowo nad klatką piersiową poszkodowanego.
        media: cpr/compressions
      - text: Uciskaj mostek na głębokość co najmniej pięciu, ale nie więcej niż sześciu centymetrów, w tempie od stu do stu dwudziestu uciśnięć na minutę.
        media: cpr/compressions
        action: CHEST_COMPRESSIONS
      - text: Po każdym uciśnięciu pozwól klatce piersiowej całkowicie wrócić do pozycji wyjściowej, nie opierając się na niej, ale nie odrywaj dłoni od klatki.
        media: cpr/compressions
    transitions:
      - when: zawsze
        goto: send_for_aed
    sources:
      - {source: erc-2025-bls, section: High quality chest compressions}
      - {source: erc-2025-bls, section: Concise resuscitation guidelines for all responders}

  - id: send_for_aed
    actions: [SEND_FOR_AED]
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: A lone rescuer is told to keep compressing and not to look for the AED; with a
        helper present the helper is asked to bring it.
      WHY: ERC: CPR must not be delayed to get an AED, and the dispatcher guides bystanders to an
        AED only when more than one is present. Whether a lone rescuer should fetch an AED that is
        visibly very close is not addressed. The question is asked here (once) only so that the
        30:2 loop does not repeat it; that is a design choice, not a guideline step.
      ERC: Role of the dispatcher; Using an automated external defibrillator (AED).
    instructions:
      - text: Jeśli ktoś jest z Tobą, poproś, żeby przyniósł AED, czyli defibrylator, jeśli jest w pobliżu.
        media: cpr/aed
        action: SEND_FOR_AED
      - text: Jeśli jesteś sam, nie przerywaj uciśnięć i nie szukaj AED.
        media: cpr/compressions
    asks: Czy umiesz wykonywać oddechy ratownicze?
    transitions:
      - when: nie jest przeszkolony albo nie potrafi wykonać oddechów ratowniczych
        goto: compressions_only
      - when: jest przeszkolony i potrafi wykonać oddechy ratownicze
        goto: compressions_30_2
    sources:
      - {source: erc-2025-bls, section: Role of the dispatcher}
      - {source: erc-2025-bls, section: Using an automated external defibrillator (AED)}
      - {source: erc-2025-bls, section: Rescue breaths}

  - id: compressions_only
    media: cpr/compressions
    actions: [CHEST_COMPRESSIONS]
    instructions:
      - text: Prowadź RKO wyłącznie z uciskaniem klatki piersiowej, czyli uciskaj bez przerw, w tempie od stu do stu dwudziestu uciśnięć na minutę.
        action: CHEST_COMPRESSIONS
      - Kontynuuj, dopóki nie przyjedzie pomoc i nie przejmie czynności albo nie każe Ci przestać.
    transitions:
      - when: >-
          AED jest na miejscu i nie jest jeszcze podłączony (ktoś go przyniósł albo rozmówca ma
          go przy sobie)
        goto: aed_attach
        log: AED_ARRIVED
        interrupt: true
      - when: AED jest już podłączony i prosi o przerwę w uciskaniu, żeby ocenić rytm
        goto: aed_analyse
        interrupt: true
      - when: przyjechała pomoc (ratownicy, zespół ratunkowy) i przejęła czynności, albo ratownik lub dyspozytor każe przestać, albo poszkodowany w oczywisty sposób odzyskuje przytomność (porusza się, otwiera oczy, prawidłowo oddycha), albo rozmówca jest zbyt zmęczony
        goto: end_cpr
        log: CPR_STOPPED
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: The conditions for stopping CPR: (1) obvious signs of recovery (moves, opens
        eyes, breathes normally), (2) the rescuer is too exhausted, (3) a rescuer or dispatcher
        tells to stop.
      WHY: ERC First Aid says only 'continue CPR until professional help arrives and takes over or
        tells you to stop'. (1) and (2) come from the earlier draft and are not in the ERC text:
        stopping on a layperson's own judgement of recovery may stop too early, and exhaustion has
        no guideline basis. Decide whether to keep, reword or remove them.
      ERC: Expectations of a first aid provider; Rescue breaths (compression-only CPR for
        untrained rescuers).
    sources:
      - {source: erc-2025-bls, section: High quality chest compressions}
      - {source: erc-2025-bls, section: Rescue breaths}
      - {source: erc-2025-first-aid, section: Expectations of a first aid provider}

  - id: compressions_30_2
    media: cpr/compressions
    actions: [CHEST_COMPRESSIONS]
    instructions:
      - text: Wykonaj trzydzieści uciśnięć klatki piersiowej, tak jak przed chwilą.
        action: CHEST_COMPRESSIONS
    transitions:
      - when: wykonano trzydzieści uciśnięć
        goto: rescue_breaths
      - when: >-
          AED jest na miejscu i nie jest jeszcze podłączony (ktoś go przyniósł albo rozmówca ma
          go przy sobie)
        goto: aed_attach
        log: AED_ARRIVED
        interrupt: true
      - when: AED jest już podłączony i prosi o przerwę w uciskaniu, żeby ocenić rytm
        goto: aed_analyse
        interrupt: true
      - when: przyjechała pomoc (ratownicy, zespół ratunkowy) i przejęła czynności, albo ratownik lub dyspozytor każe przestać, albo poszkodowany w oczywisty sposób odzyskuje przytomność (porusza się, otwiera oczy, prawidłowo oddycha), albo rozmówca jest zbyt zmęczony
        goto: end_cpr
        log: CPR_STOPPED
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: The same stopping conditions as in `compressions_only`.
      WHY: See `compressions_only`: only 'professional help takes over or tells you to stop' is in
        the ERC text; signs of recovery and exhaustion are additions of this project.
      ERC: Rescue breaths (30:2 for rescuers who are trained, able and willing).
    sources:
      - {source: erc-2025-bls, section: Rescue breaths}
      - {source: erc-2025-bls, section: Concise resuscitation guidelines for all responders}

  - id: rescue_breaths
    actions: [OPEN_AIRWAY, RESCUE_BREATHS]
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: The grip for rescue breaths: pinch the nose, let the mouth open, keep the chin
        lifted, seal the mouth over the person's mouth.
      WHY: The ERC text gives only: enough air for the chest to start to rise, about one second
        per breath, no more than ten seconds without compressions for two breaths, and to consider
        foreign body airway obstruction after two failed attempts. The grip is shown in ERC BLS
        figures (not in the text) and was not checked against them.
      ERC: Rescue breaths.
    instructions:
      - text: Ponownie udrożnij drogi oddechowe, odginając głowę do tyłu i unosząc brodę. Palcem wskazującym i kciukiem ręki, która jest na czole, zaciśnij skrzydełka nosa poszkodowanego.
        media: cpr/pinch-nose
        action: OPEN_AIRWAY
      - text: Pozwól, żeby usta poszkodowanego się otworzyły, ale trzymaj brodę uniesioną. Weź normalny wdech i szczelnie obejmij swoimi ustami usta poszkodowanego.
        media: cpr/rescue-breath
      - text: Wdmuchuj powietrze jednostajnie, przez około jedną sekundę, obserwując, czy klatka piersiowa się unosi. Wdmuchnij tylko tyle powietrza, żeby klatka zaczęła się unosić.
        media: cpr/rescue-breath
        action: RESCUE_BREATHS
      - text: Odsuń usta i obserwuj, jak klatka piersiowa opada. Weź kolejny normalny wdech i wykonaj drugi oddech ratowniczy.
        media: cpr/rescue-breath
      - text: Nie przerywaj uciśnięć dłużej niż dziesięć sekund na dwa oddechy, nawet jeśli któryś z nich byłby nieskuteczny. Bez opóźnienia wróć dłońmi na mostek i wykonaj kolejne trzydzieści uciśnięć. Kontynuuj w stosunku trzydzieści uciśnięć do dwóch oddechów.
        media: cpr/compressions
      - text: Jeśli po dwóch próbach nie udaje się wdmuchnąć powietrza, rozważ, że przyczyną jest ciało obce w drogach oddechowych, i powiedz o tym dyspozytorowi.
        media: cpr/call-112
    transitions:
      - when: wykonano dwa oddechy ratownicze
        goto: compressions_30_2
    sources:
      - {source: erc-2025-bls, section: Rescue breaths}

  - id: aed_attach
    actions: [AED_ATTACH]
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: What a lone rescuer does: pauses compressions only for the time of attaching the
        pads.
      WHY: ERC says only that if more than one rescuer is present one continues CPR while the
        other attaches the pads; the lone-rescuer case is an inference from that sentence. Pad
        positions are not described in the text (they are on the device and in ERC Fig. 6).
      ERC: Using an automated external defibrillator (AED): use it as soon as it is available,
        follow its prompts, attach the pads to the bare chest.
    instructions:
      - text: Włącz AED. Niektóre urządzenia włączają się same po otwarciu pokrywy, a w innych trzeba nacisnąć przycisk zasilania.
        media: cpr/aed
      - text: Jeśli jest z Tobą druga osoba, niech uciska klatkę piersiową, kiedy Ty przyklejasz elektrody. Jeśli jesteś sam, przerwij uciskanie tylko na czas przyklejania elektrod.
        media: cpr/aed
      - text: Odsłoń klatkę piersiową poszkodowanego i przyklej elektrody w miejscach pokazanych na urządzeniu lub na elektrodach.
        media: cpr/aed
        action: AED_ATTACH
      - text: Dalej wykonuj polecenia głosowe AED.
        media: cpr/aed
    transitions:
      - when: elektrody są przyklejone
        goto: aed_analyse
    sources:
      - {source: erc-2025-bls, section: Using an automated external defibrillator (AED)}

  - id: aed_analyse
    instructions:
      - text: Kiedy AED analizuje rytm serca, nie dotykaj poszkodowanego i dopilnuj, żeby nikt go nie dotykał.
        media: cpr/aed
    asks: Czy AED zaleca wyładowanie?
    transitions:
      - when: AED zaleca wyładowanie
        goto: aed_shock
      - when: AED nie zaleca wyładowania albo każe wznowić RKO
        goto: resume_compressions
    sources:
      - {source: erc-2025-bls, section: Using an automated external defibrillator (AED)}

  - id: aed_shock
    actions: [AED_SHOCK]
    instructions:
      - text: Upewnij się, że nikt nie dotyka poszkodowanego.
        media: cpr/aed
      - text: Jeśli AED każe nacisnąć przycisk wyładowania, naciśnij go. Niektóre urządzenia wykonują wyładowanie same.
        media: cpr/aed
        action: AED_SHOCK
      - text: Zaraz po wyładowaniu natychmiast wróć do uciskania klatki piersiowej.
        media: cpr/compressions
    transitions:
      - when: wykonano wyładowanie
        goto: resume_compressions
    sources:
      - {source: erc-2025-bls, section: Using an automated external defibrillator (AED)}

  - id: resume_compressions
    actions: [CHEST_COMPRESSIONS]
    note: >-
      After every AED analysis the rescuer goes back to compressions at once; the question about
      rescue breaths is asked again because the dialogue does not remember the earlier answer.
      The ERC says the AED asks for a pause after "a set time interval" and gives no number.
    instructions:
      - text: Natychmiast uciskaj klatkę piersiową, tak jak wcześniej.
        media: cpr/compressions
        action: CHEST_COMPRESSIONS
      - text: Dalej wykonuj polecenia AED. Po jakimś czasie poprosi o przerwę w uciskaniu, żeby ponownie ocenić rytm serca.
        media: cpr/compressions
    asks: Czy umiesz wykonywać oddechy ratownicze?
    transitions:
      - when: nie jest przeszkolony albo nie potrafi wykonać oddechów ratowniczych
        goto: compressions_only
      - when: jest przeszkolony i potrafi wykonać oddechy ratownicze
        goto: compressions_30_2
    sources:
      - {source: erc-2025-bls, section: Using an automated external defibrillator (AED)}

  - id: end_cpr
    media: cpr/stay-observe
    note: |-
      NEEDS MEDICAL REVIEW:
      UNCERTAIN: The closing instruction to stay with the person and follow the dispatcher or the
        rescue team.
      WHY: It is not a guideline step. Only the condition 'professional help takes over or tells
        you to stop' comes from ERC; the rest follows the project safety rules.
      ERC: Expectations of a first aid provider.
    instructions:
      - Dobrze. Zostań przy poszkodowanym i słuchaj poleceń dyspozytora lub zespołu ratunkowego.
    transitions: []
    sources:
      - {source: erc-2025-first-aid, section: Expectations of a first aid provider}
